<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MetaCare Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
font-family:Segoe UI;
color:white;
overflow-x:hidden;
}


.sidebar{
width:240px;
height:100vh;
background:#0d1b2a;
position:fixed;
left:0;
top:0;
padding:25px;
transition:0.3s;
z-index:600;
}

.logo{
font-size:22px;
font-weight:600;
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar li{
padding:12px;
border-radius:10px;
margin-bottom:10px;
cursor:pointer;
transition:0.3s;
}

.sidebar li:hover{
background:#1b263b;
transform:translateX(5px);
}

.activeMenu{
background:#0077b6;
}


.sidebar a{
text-decoration:none;
color:white;
display:block;
}


.main{
margin-left:260px;
padding:30px;
transition:0.3s;
}


.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.search{
width:250px;
border-radius:30px;
padding:8px 20px;
border:none;
outline:none;
}


.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border:none;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
color:white;
}


.vitalCircle{
width:90px;
height:90px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
color:white;
animation:pulse 3s infinite;
}

.blue{background:#00c6ff}
.dark{background:#111}
.light{background:#4facfe}
.sky{background:#afa9ac}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}


.progress{
height:10px;
background:#1b263b;
}

.progress-bar{
background:linear-gradient(45deg,#00c6ff,#0072ff);
}



.patientCard{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.uploadBox{
border:2px dashed #3b82f6;
padding:30px;
text-align:center;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}


.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:10px;
}

.title{
font-size:22px;
}

.top-right{
display:flex;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.search{
width:220px;
border-radius:30px;
padding:8px 18px;
border:none;
outline:none;
}
.notif-wrapper{
position:relative;
}

.notification{
font-size:20px;
cursor:pointer;
transition:0.3s;
}

.notification:hover{
color:#00c6ff;
}


.notif-badge{
position:absolute;
top:-5px;
right:-6px;
background:red;
color:white;
font-size:10px;
padding:2px 5px;
border-radius:50%;
}


.profile{
display:flex;
align-items:center;
gap:8px;
}

.profileImg{
width:32px;
height:32px;
border-radius:50%;
border:2px solid #00c6ff;
}

#userEmail{
font-size:14px;
white-space:nowrap;
}


@media(max-width:768px){

.topbar{
flex-direction:column;
align-items:flex-start;
}

.top-right{
width:100%;
justify-content:space-between;
}

.search{
width:100%;
}

#userEmail{
font-size:12px;
}

}

.uploadBox:hover{
background:rgba(255,255,255,0.1);
}


.menu-toggle{
display:none;
position:fixed;
top:20px;
left:20px;
z-index:500;
font-size:26px;
background:#0d1b2a;
border:none;
color:white;

padding:10px 12px;
border-radius:10px;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(25, 23, 23, 0.5);
opacity:0;
visibility:hidden;
transition:0.3s;
z-index:400;
}

.overlay.active{
opacity:1;
visibility:visible;
}



@media(max-width:900px){

.menu-toggle{
display:block;
position: absolute;

}

.sidebar{
left:-260px;
}

.sidebar.active{
left:0;
}

.main{
margin-left:0;
padding-top:80px;
}

}

</style>

</head>

<body>


<div class="sidebar" id="sidebar">

<div class="logo">
<i class="bi bi-heart-pulse-fill text-info"></i>
StacklyCare
</div>

<ul>

<li class="activeMenu">
<a href="patdashboard.html"><i class="bi bi-grid"></i> Overview</a>
</li>

<li>
<a href="appointmentdash.html"><i class="bi bi-calendar-check"></i> Appointment</a>
</li>

<li>
<a href="report.html"><i class="bi bi-file-earmark-medical"></i> Report</a>
</li>

<li>
<a href="index.html"><i class="bi bi-house"></i> Back Home</a>
</li>

</ul>

</div>

<div class="overlay" onclick="toggleMenu()"></div>

<button class="menu-toggle" onclick="toggleMenu()">
<i class="bi bi-list"></i>
</button>


<div class="main">


<div class="topbar">

<h3 class="title">Overview Medical History</h3>

<div class="top-right">

<input class="search" placeholder="Search patient">

<div class="notif-wrapper">
<i class="bi bi-bell-fill notification"></i>
<span class="notif-badge">3</span>
</div>

<div class="profile">
<img src="https://i.pravatar.cc/40" class="profileImg">
<span id="userEmail"></span>
</div>

</div>

</div>


<div class="card p-4 mb-4">

<h5 class="mb-4">Vital Signs</h5>

<div class="row text-center">

<div class="col-md-3">
<div class="vitalCircle dark">4.8</div>
<p>PRQ</p>
</div>

<div class="col-md-3">
<div class="vitalCircle sky">99%</div>
<p>Oxygen</p>
</div>

<div class="col-md-3">
<div class="vitalCircle light">64</div>
<p>Heart Rate</p>
</div>

<div class="col-md-3">
<div class="vitalCircle blue">122</div>
<p>Blood Pressure</p>
</div>

</div>

</div>


<div class="card p-4 mb-4">

<h5>Health Overview</h5>

<canvas id="healthChart"></canvas>

</div>


<div class="card p-4 mb-4">

<h5>Health Progress</h5>

<p>Blood Pressure</p>
<div class="progress mb-3">
<div class="progress-bar" style="width:80%"></div>
</div>

<p>Oxygen Level</p>
<div class="progress mb-3">
<div class="progress-bar" style="width:95%"></div>
</div>

<p>Heart Rate</p>
<div class="progress mb-3">
<div class="progress-bar" style="width:70%"></div>
</div>

</div>

</div>

<script>

function toggleMenu(){

const sidebar=document.getElementById("sidebar");
const overlay=document.querySelector(".overlay");

sidebar.classList.toggle("active");
overlay.classList.toggle("active");

}


let email=localStorage.getItem("userEmail");
document.getElementById("userEmail").innerText=email;


const ctx=document.getElementById('healthChart').getContext('2d');

const gradient=ctx.createLinearGradient(0,0,0,400);
// gradient.addColorStop(0,"#0077b6");
// gradient.addColorStop(1,"#0077b6");

new Chart(ctx,{

type:'line',

data:{
labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
datasets:[{
label:"Heart Rate",
data:[70,75,72,80,76,85,78],
borderColor:"green",
backgroundColor:gradient,
fill:true,
tension:0.4,
pointRadius:5
}]
},

options:{
plugins:{
legend:{display:false}
},
animation:{
duration:2000
}
}

});

</script>

</body>
</html>
