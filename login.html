<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Stackly Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="login.css">



</head>

<body>
    <div class="blob blob1"></div>
<div class="blob blob2"></div>

<a href="index.html" class="btn btn-light back-home">
<i class="bi bi-arrow-left"></i> Back
</a>

<div class="login-card">

<div class="logo">
<i class="bi bi-capsule-pill"></i> Stackly
</div>

<div class="subtitle">
Login to your account
</div>

<form onsubmit="loginUser(event)">

<div class="mb-3">
  <label class="form-label">Login As</label>
  <select class="form-select w-100" id="role" required>
    <option value="" disabled selected>Select Role</option>
    <option value="researcher">Researcher</option>
    <option value="patient">Patient</option>
  </select>
</div>

<div class="mb-3">

<label class="form-label">Email</label>

<div class="input-group w-100">

<span class="input-group-text">
<i class="bi bi-envelope"></i>
</span>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter email"
required
>

</div>

</div>

<div class="mb-3">

<label class="form-label" >Password</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock"></i>
</span>

<input
type="password"
id="password"
class="form-control"
placeholder="Enter password"
required
>

<span class="input-group-text" onclick="togglePassword()">
<i class="bi bi-eye" id="eyeIcon"></i>
</span>

</div>

</div>

<div class="form-check">

<input class="form-check-input" type="checkbox" required>

<label class="form-check-label">
Remember me
</label>

</div>

<div class="extra-links">
<a href="error.html">Forgot Password?</a>
</div>
<button id="loginBtn" type="submit" class="btn login-btn w-100 mt-3">
<i class="bi bi-box-arrow-in-right"></i> Login
</button>

</form>

<div class="signup-link">
Don't have an account?
<a href="register.html">Sign Up</a>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function togglePassword(){

let pass = document.getElementById("password");
let eye = document.getElementById("eyeIcon");

if(pass.type === "password"){
pass.type = "text";
eye.classList.replace("bi-eye","bi-eye-slash");
}
else{
pass.type = "password";
eye.classList.replace("bi-eye-slash","bi-eye");
}

}

function loginUser(event){

event.preventDefault();

let btn = document.getElementById("loginBtn");
let card = document.querySelector(".login-card");

let role = document.getElementById("role").value;

/* START LOADING */
btn.classList.add("loading");

/* SIMULATE API */
setTimeout(()=>{

if(!role){
btn.classList.remove("loading");

card.classList.add("error");
setTimeout(()=>card.classList.remove("error"),400);

alert("Please select role");
return;
}


btn.classList.remove("loading");
btn.classList.add("success");


setTimeout(()=>{
if(role==="patient"){
window.location.href="patdashboard.html";
}else{
window.location.href="resdashboard.html";
}
},1200);

},1500);

}
</script>
<script>


gsap.to(".login-card",{
y:0,
opacity:1,
duration:1.2,
ease:"power3.out"
});


document.querySelectorAll(".form-control").forEach(input=>{
input.addEventListener("focus",()=>{
input.style.boxShadow="0 0 10px #00eaff";
});
input.addEventListener("blur",()=>{
input.style.boxShadow="none";
});
});


document.addEventListener("mousemove",(e)=>{
let x = (window.innerWidth/2 - e.pageX)/25;
let y = (window.innerHeight/2 - e.pageY)/25;

document.querySelector(".login-card").style.transform =
`translate(${x}px,${y}px)`;
});

</script>

</body>
</html>
