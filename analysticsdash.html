<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bio Analytics</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="analysticsdash.css">
</head>

<body>

<div class="sidebar" id="sidebar">
    <h4>🧬 Analytics</h4>

    <ul>
       <li><a href="resdashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li><a href="analysticsdash.html"><i class="bi bi-activity"></i> Analytics</a></li>
        <li><a href="index.html"><i class="bi bi-house"></i> Back to Home</a></li>
    </ul>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="main">
    <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </button>

        <div class="right">
            <i class="bi bi-bell"></i>
            <span id="topEmail"></span>
        </div>
    </div>

    <div class="container-fluid">

        <div class="row g-3 mt-3">
            <div class="col-6 col-md-3">
                <div class="card stat">
                    <h6>Experiments</h6>
                    <h3 id="expCount">120</h3>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card stat">
                    <h6>Data</h6>
                    <h3>980GB</h3>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card stat">
                    <h6>Success</h6>
                    <h3>87%</h3>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card stat">
                    <h6>Samples</h6>
                    <h3 id="samples">42</h3>
                </div>
            </div>
        </div>
        <div class="row mt-3 g-3">
            <div class="col-12 col-lg-6">
                <div class="card p-3">
                    <h5>Experiment Growth</h5>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card p-3">
                    <h5>Sample Distribution</h5>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

    </div>
</div>

<script >
    
const email = localStorage.getItem("userEmail");
if(email){
    document.getElementById("topEmail").innerText = email;
}

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

Chart.defaults.color = "#cbd5f5";
new Chart(document.getElementById("lineChart"), {
    type: "line",
    data: {
        labels: ["Mon","Tue","Wed","Thu","Fri","Sat"],
        datasets: [{
            data: [12,19,10,25,22,30],
            borderColor: "#6366f1",
            backgroundColor: "rgba(99,102,241,0.2)",
            fill: true,
            tension: 0.4
        }]
    }
});

new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
        labels: ["DNA","RNA","Protein","Cells"],
        datasets: [{
            data: [30,20,25,15],
            backgroundColor: "#8b5cf6"
        }]
    }
});

setInterval(()=>{
    document.getElementById("expCount").innerText = Math.floor(Math.random()*200);
    document.getElementById("samples").innerText = Math.floor(Math.random()*100);
},3000);
</script>
</body>
</html>
